# ORNEK Secret — gercek degerlerle doldurup uygulayin, ama bu dosyayi
# gercek sirlarla repoya COMMIT ETMEYIN. Uretimde tercihen harici bir
# sir yoneticisi (Sealed Secrets, External Secrets, Vault) kullanin.
#
# Olusturmanin pratik yolu (dosyayi commit etmeden):
#   kubectl -n triageops create secret generic triageops-secrets \
#     --from-env-file=.env
apiVersion: v1
kind: Secret
metadata:
  name: triageops-secrets
  namespace: triageops
type: Opaque
stringData:
  AZDO_BASE_URL: "https://tfs.sirket.local/DefaultCollection"
  AZDO_PROJECT: "MyProject"
  AZDO_PAT: "<personal-access-token>"
  AZDO_API_VERSION: "7.0"
  AZDO_VERIFY_SSL: "false"
  LLM_BASE_URL: "http://llm-svc.triageops.svc.cluster.local:11434/v1"
  LLM_MODEL: "qwen2.5-coder:14b"
  LLM_API_KEY: "not-needed"
  WEBHOOK_SECRET: "uzun-rastgele-bir-deger"
