# Yerel gelistirme / tek host icin TriageOps webhook servisi.
# Kullanim:
#   cp .env.example .env   # degerleri doldur
#   docker compose up --build
#
# Not: Service Hook'lar HTTPS ister. Yerel testte servisin onune bir tunel
# (ngrok) veya TLS sonlandiran bir reverse proxy koyun.

services:
  webhook:
    build: .
    image: triageops:latest
    ports:
      - "8080:8080"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
